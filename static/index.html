<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/static/icon.png">
<title>ScriptPlayground</title>
<style>
  :root {
    --background-primary: #313338; --background-secondary: #2b2d31; --background-secondary-alt: #383a40; --background-tertiary: #1e1f22;
    --background-floating: #111214; --background-input: #232428; --background-modifier-hover: #3a3c43; --background-modifier-selected: #404249;
    --text-normal: #dbdee1; --text-muted: #949ba4; --text-heading: #f2f3f5; --text-code: #e3e5e8; --text-link: #00a8fc;
    --interactive-normal: #b5bac1; --interactive-hover: #dbdee1; --interactive-active: #fff;
    --brand-primary: #5865f2; --brand-primary-hover: #4752c4; --status-success: #23a559; --status-success-hover: #1a6334;
    --status-danger: #da373c; --status-danger-hover: #a12d31; --status-warning: #f0b232;
    --border-subtle: #3f4147; --font-ui: "gg sans", "Noto Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --bg0: var(--background-tertiary); --bg1: var(--background-secondary); --bg2: var(--background-primary); --bg3: var(--background-secondary-alt);
    --txt: var(--text-normal); --txt-dim: var(--text-muted); --txt-head: var(--text-heading);
    --blurple: var(--brand-primary); --green: var(--status-success); --red: var(--status-danger); --orange: var(--status-warning);
    --link: var(--text-link); --border: var(--border-subtle);
    --motion-fast: 100ms; --motion-normal: 150ms; --motion-slow: 250ms;
    --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); --ease-decelerate: cubic-bezier(0.2, 0, 0, 1);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg0); color: var(--txt);
    font: 15px/1.45 var(--font-ui);
    color-scheme: dark;
    overflow: hidden;
  }
  button, input, select, textarea { font-family: var(--font-ui); }
  #app { display: grid; grid-template-columns: 72px 280px 1fr 460px; height: 100vh; }
  button, a, .channel-row, .server-icon, .inspect-tab, .inspect-entry { transition: background-color var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), border-radius var(--motion-fast) var(--ease-standard), transform var(--motion-fast) var(--ease-standard), opacity var(--motion-fast) var(--ease-standard); }

  /* ---------- server rail ---------- */
  #server-rail { background: var(--background-tertiary); display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 12px; border-right: 1px solid var(--border); }
  .server-icon { width: 44px; height: 44px; border-radius: 22px; background: var(--background-primary); color: var(--text-normal); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; letter-spacing: .02em; position: relative; }
  .server-icon::before { content: ""; position: absolute; left: -14px; width: 4px; height: 8px; border-radius: 0 4px 4px 0; background: var(--text-normal); transform: scaleY(0); transition: transform var(--motion-normal) var(--ease-standard); }
  .server-icon:hover { border-radius: 14px; background: var(--background-modifier-hover); }
  .server-icon:hover::before { transform: scaleY(1); }
  .server-icon.active { border-radius: 14px; background: var(--brand-primary); color: #fff; }
  .server-icon.active::before { height: 32px; transform: scaleY(1); }
  .server-separator { width: 32px; height: 1px; background: var(--border); margin: 2px 0; }

  /* ---------- channel sidebar ---------- */
  #sidebar { background: var(--bg1); display: flex; flex-direction: column; border-right: 1px solid var(--border); }
  .guild-head { padding: 10px 16px; font-weight: 700; color: var(--txt-head); font-size: 15px;
                border-bottom: 1px solid var(--border); box-shadow: 0 1px 0 rgba(0,0,0,.2); }
  .local-label { color: var(--text-muted); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .channel-row { padding: 8px 16px; color: var(--txt-dim); cursor: pointer; display: flex; gap: 6px; align-items: center; border-radius: 4px; }
  .channel-row.active { background: var(--bg3); color: var(--txt-head); margin: 0 8px; padding: 8px 8px; }
  .channel-row:hover { color: var(--txt-head); background: var(--background-modifier-hover); }
  .channel-row .unread { margin-left: auto; background: var(--red); color: #fff; font-size: 11px; font-weight: 700;
                          border-radius: 8px; padding: 0 6px; min-width: 10px; text-align: center; }
  .channel-row .unread.new { animation: unread-in var(--motion-normal) var(--ease-decelerate); }
  .channel-cat { padding: 14px 16px 4px; font-size: 11px; font-weight: 700; letter-spacing: .05em;
                 color: var(--txt-dim); text-transform: uppercase; cursor: pointer; display: flex; align-items: center; gap: 4px; }
  .channel-chevron { display: inline-block; transform: rotate(0deg); transition: transform var(--motion-fast) var(--ease-standard); }
  .channel-chevron.closed { transform: rotate(-90deg); }
  .channel-items.collapsed { display: none; }
  .sidebar-foot { margin-top: auto; padding: 10px; background: var(--background-tertiary); display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--border); }
  .avatar.status-ring { border: 2px solid var(--status-success); box-shadow: 0 0 0 2px var(--background-tertiary); }
  .avatar { width: 34px; height: 34px; border-radius: 50%; flex: none; background: var(--brand-primary);
            display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; font-size: 14px; }
  .me-context { color: var(--text-muted); font-size: 9px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .me-name { font-size: 13px; font-weight: 600; color: var(--txt-head); }
  .me-tag { font-size: 11px; color: var(--txt-dim); }
  #act-as { width: 112px; margin-left: auto; background: var(--bg0); color: var(--txt); border: 1px solid var(--border);
             border-radius: 4px; padding: 4px 6px; font: inherit; font-size: 11px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  /* ---------- chat ---------- */
  #chat-pane { display: flex; flex-direction: column; background: var(--bg2); min-width: 0; }
  #chat-head { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px;
               color: var(--txt-head); font-weight: 700; box-shadow: 0 1px 0 rgba(0,0,0,.2); }
  #chat-title { min-width: 0; display: flex; flex-direction: column; }
  #chat-head-name { line-height: 1.2; }
  #head-topic { color: var(--txt-dim); font-size: 11px; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #chat-head .desc { color: var(--txt-dim); font-weight: 400; font-size: 13px; border-left: 1px solid var(--border); padding-left: 10px;
                     overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sim-badge { margin-left: auto; color: var(--text-muted); font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; }
  #chat-content { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 180px; position: relative; }
  #timeline { min-width: 0; overflow-y: auto; padding: 16px 0 8px; }
  #member-list { overflow-y: auto; padding: 16px 10px; background: var(--bg1); border-left: 1px solid var(--border); }
  .member-group { color: var(--txt-dim); font-size: 10px; font-weight: 700; letter-spacing: .06em; margin: 0 6px 6px; text-transform: uppercase; }
  .member-row { display: flex; align-items: center; gap: 8px; padding: 5px 6px; color: var(--txt-dim); border-radius: 4px; }
  .member-row:hover { background: var(--background-modifier-hover); color: var(--txt-head); }
  .member-avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 700; flex: none; position: relative; }
  .member-avatar::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 8px; height: 8px; border-radius: 50%; background: var(--status-success); border: 2px solid var(--bg1); }
  .member-avatar[data-status="idle"]::after { background: var(--status-warning); }
  .member-avatar[data-status="dnd"]::after, .member-avatar[data-status="offline"]::after, .member-avatar[data-status="invisible"]::after { background: var(--text-muted); }
  .member-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  .member-name.bot { color: var(--brand-primary); }
  .day-divider { display: flex; align-items: center; gap: 8px; margin: 8px 16px; color: var(--txt-dim); font-size: 11px; font-weight: 600; }
  .day-divider.entering { animation: content-in var(--motion-normal) var(--ease-decelerate); }
  .day-divider::before, .day-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .msg { display: flex; gap: 12px; padding: 4px 16px; position: relative; border-radius: 2px; }
  .msg:hover { background: rgba(0,0,0,.06); }
  .msg.entering { animation: content-in var(--motion-normal) var(--ease-decelerate); }
  .msg.grouped { padding-top: 1px; padding-bottom: 1px; }
  .msg.grouped > .avatar { visibility: hidden; }
  .msg.grouped .msg-author, .msg.grouped .msg-time { display: none; }
  .msg-actions { position: absolute; top: -10px; right: 16px; display: flex; gap: 2px; padding: 2px; background: var(--background-floating); border: 1px solid var(--border); border-radius: 5px; opacity: 0; transform: translateY(4px); pointer-events: none; }
  .msg:hover .msg-actions, .msg:focus-within .msg-actions { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .msg-action { border: 0; background: transparent; color: var(--interactive-normal); border-radius: 3px; padding: 3px 5px; cursor: pointer; font-size: 11px; }
  .msg-action:hover { background: var(--background-modifier-hover); color: var(--interactive-hover); }
  .msg .avatar { margin-top: 2px; }
  .msg-author { font-weight: 600; color: var(--txt-head); font-size: 15px; }
  .bot-tag { background: var(--blurple); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 4px;
             vertical-align: 2px; margin-left: 4px; }
  .msg-time { color: var(--txt-dim); font-size: 11px; margin-left: 6px; }
  .msg-body { min-width: 0; flex: 1; }
  .msg-content { white-space: pre-wrap; word-wrap: break-word; }
  .msg-content .mention { background: rgba(88,101,242,.3); color: #c9cdfb; border-radius: 3px; padding: 0 2px; font-weight: 500; }
  .ephemeral-note { color: var(--txt-dim); font-size: 11px; font-style: italic; margin-top: 2px; }
  .edited-note { color: var(--txt-dim); font-size: 10px; margin-left: 6px; }
  .attachment { margin-top: 6px; color: var(--txt-dim); font-size: 13px; background: var(--bg1); border: 1px solid var(--border);
                border-radius: 6px; padding: 6px 10px; display: inline-block; }
  .attach-thumb { max-width: 280px; max-height: 180px; border-radius: 6px; display: block; margin-top: 6px; }
  .attach-thumb-wrap { display: inline-block; background: var(--bg1); border: 1px solid var(--border); border-radius: 8px;
                       padding: 8px; margin-top: 6px; }
  .attach-name { font-size: 11.5px; color: var(--txt-dim); margin-top: 4px; max-width: 280px; overflow: hidden;
                 text-overflow: ellipsis; white-space: nowrap; }

  /* embeds */
  .embed { margin-top: 4px; max-width: 520px; display: flex; border-radius: 6px; background: var(--bg1); overflow: hidden; }
  .embed-bar { width: 4px; flex: none; background: var(--blurple); }
  .embed-inner { padding: 10px 14px; min-width: 0; flex: 1; }
  .embed-title { color: var(--txt-head); font-weight: 700; font-size: 14px; margin-bottom: 3px; }
  .embed-desc { font-size: 13.5px; white-space: pre-wrap; word-wrap: break-word; }
  .embed-fields { display: flex; flex-wrap: wrap; margin-top: 8px; gap: 8px 16px; }
  .embed-field { min-width: 120px; }
  .embed-field.inline { flex: 1 1 30%; }
  .embed-field-name { font-weight: 700; font-size: 13px; color: var(--txt-head); margin-bottom: 1px; }
  .embed-field-value { font-size: 13px; white-space: pre-wrap; }
  .embed-footer { margin-top: 8px; font-size: 11px; color: var(--txt-dim); }
  .embed-image, .embed-thumb { border-radius: 4px; max-width: 100%; }
  .embed-image { margin-top: 10px; max-width: 400px; align-self: flex-start; }
  .embed-thumb { width: 68px; height: 68px; object-fit: cover; flex: none; }
  .embed-right { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .embed-body { display: flex; gap: 12px; min-width: 0; }
  .embed-code { background: var(--background-secondary); border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px;
                font: 12.5px/1.4 Consolas, monospace; white-space: pre-wrap; word-break: break-word; display: block; margin: 2px 0; }
  .embed-author { font-size: 12.5px; font-weight: 700; color: var(--txt-head); margin-bottom: 4px; }

  /* components */
  .comp-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .btn { border: none; border-radius: 4px; padding: 6px 14px; font-size: 13.5px; font-weight: 600; cursor: pointer;
         color: #fff; font-family: inherit; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-1 { background: var(--blurple); } .btn-1:hover:not(:disabled) { background: var(--brand-primary-hover); }
  .btn-2 { background: #4e5058; } .btn-2:hover:not(:disabled) { background: #6d6f78; }
  .btn-3 { background: var(--green); } .btn-3:hover:not(:disabled) { background: var(--status-success-hover); }
  .btn-4 { background: var(--red); } .btn-4:hover:not(:disabled) { background: var(--status-danger-hover); }
  .btn-5 { background: #80848e; color: #000; } .btn-5:hover:not(:disabled) { background: #6d6f78; }
  .btn.btn-link { background: transparent; color: var(--link); text-decoration: underline; }
  .select-wrap { position: relative; }
  .sel { appearance: none; background: var(--bg1); color: var(--txt); border: 1px solid var(--border); border-radius: 4px;
         padding: 7px 30px 7px 10px; font-size: 13.5px; font-family: inherit; cursor: pointer; max-width: 300px; }
  .sel:hover:not(:disabled) { border-color: var(--interactive-normal); }
  .sel.multi { max-width: 340px; }
  .select-wrap::after { content: "▾"; position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
                        color: var(--txt-dim); pointer-events: none; font-size: 12px; }
  .sel.picker { padding-left: 10px; }
  .sel.picker option::before { margin-right: 4px; }

  /* composer */
  #composer { padding: 0 16px 20px; position: relative; }
  #composer-box { display: flex; align-items: center; gap: 10px; background: var(--bg3); border-radius: 8px; padding: 10px 14px; }
  #composer input { flex: 1; background: transparent; border: none; outline: none; color: var(--txt); font: inherit; }
  #composer input::placeholder { color: var(--txt-dim); }
  #palette { position: absolute; bottom: calc(100% - 10px); left: 16px; right: 16px; background: var(--bg1);
             border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.45);
             visibility: hidden; opacity: 0; transform: translateY(4px); pointer-events: none; z-index: 30; overflow: hidden; max-height: 260px; overflow-y: auto;
             transition: opacity var(--motion-fast) var(--ease-standard), transform var(--motion-fast) var(--ease-standard); }
  #palette.open { visibility: visible; opacity: 1; transform: translateY(0); pointer-events: auto; }
  .palette-item { padding: 9px 14px; cursor: pointer; display: flex; gap: 10px; align-items: baseline; }
  .palette-item:hover, .palette-item.active { background: var(--bg3); transform: translateX(2px); }
  .palette-item .pname { color: var(--txt-head); font-weight: 700; }
  .palette-item .pdesc { color: var(--txt-dim); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .palette-empty { padding: 10px 14px; color: var(--txt-dim); font-size: 13px; font-style: italic; }
  #cmd-form { position: absolute; left: 16px; right: 16px; bottom: 20px; z-index: 31; visibility: hidden; opacity: 0; transform: translateY(4px); pointer-events: none; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; background: var(--bg3); border-radius: 8px; padding: 8px 12px; transition: opacity var(--motion-fast) var(--ease-standard), transform var(--motion-fast) var(--ease-standard); }
  #cmd-form.open { visibility: visible; opacity: 1; transform: translateY(0); pointer-events: auto; }
  .cmd-chip { background: var(--blurple); color: #fff; border-radius: 4px; padding: 2px 8px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .cmd-chip.msg-chip { background: var(--bg1); border: 1px solid var(--border); color: var(--txt-dim); font-size: 11.5px; padding: 1px 6px; }
  #cmd-form .pf { display: flex; flex-direction: column; gap: 2px; min-width: 110px; flex: 1; }
  #cmd-form .pf label { font-size: 10.5px; color: var(--txt-dim); font-weight: 700; letter-spacing: .03em; }
  #cmd-form .pf input, #cmd-form .pf select { background: var(--bg0); border: 1px solid var(--background-input); border-radius: 4px;
      color: var(--txt); padding: 6px 8px; font: inherit; font-size: 13px; outline: none; min-width: 0; }
  #cmd-form .pf input:focus, #cmd-form .pf select:focus { border-color: var(--blurple); }
  #cmd-form .pf .req { color: var(--red); }
  #cmd-send { background: var(--blurple); color: #fff; border: none; border-radius: 4px; padding: 8px 16px;
              font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
  #cmd-send:hover { background: var(--brand-primary-hover); }
  #cmd-cancel { background: transparent; border: none; color: var(--txt-dim); cursor: pointer; font-size: 15px; padding: 4px; }
  #cmd-cancel:hover { color: var(--txt); }

  /* ---------- Components V2 (from the Embeder) ---------- */
  .v2-root { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; max-width: 440px; }
  .v2-container { background: var(--bg1); border: 1px solid var(--border); border-left: 4px solid var(--blurple);
                  border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .v2-section { display: flex; gap: 12px; align-items: flex-start; }
  .v2-section-texts { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .v2-accessory { flex: none; }
  .v2-text { white-space: pre-wrap; word-wrap: break-word; font-size: 14.5px; }
  .v2-thumb { width: 84px; height: 84px; object-fit: cover; border-radius: 8px; }
  .v2-gallery { display: flex; gap: 6px; flex-wrap: wrap; }
  .v2-gallery-img { height: 96px; border-radius: 8px; object-fit: cover; max-width: 200px; }
  .v2-separator { height: 1px; background: var(--border); margin: 2px 0; }
  .v2-separator.large { height: 8px; background: transparent; }
  .v2-spoiler { filter: blur(12px); transition: filter var(--motion-fast) var(--ease-standard); cursor: pointer; }
  .v2-spoiler.revealed { filter: none; }
  .v2-spoiler-inline { filter: blur(4px); }
  .v2-container .comp-row { margin-top: 0; }

  /* ---------- toolbar cross-links ---------- */
  #chat-head .head-link { color: var(--link); font-size: 12.5px; font-weight: 600; cursor: pointer;
                          border: 1px solid var(--border); border-radius: 6px; padding: 3px 9px; text-decoration: none; }
  #chat-head .head-link:hover { background: var(--bg3); }
  .lib-btn.link-btn { color: var(--link); border-color: #1e3a5c; }
  .lib-btn.link-btn:hover { background: rgba(0,168,252,.08); }

  /* ---------- workspace + block editor ---------- */
  #workspace-bar { display: flex; gap: 6px; align-items: center; padding: 7px 14px; border-bottom: 1px solid var(--border); }
  #workspace-bar label { color: var(--txt-dim); font-size: 11px; font-weight: 700; text-transform: uppercase; }
  #workspace-select { flex: 1; min-width: 0; background: var(--bg0); color: var(--txt); border: 1px solid var(--background-input); border-radius: 6px; padding: 5px; }
  #block-panel { display: none; position: absolute; inset: 84px 14px 14px; z-index: 4; background: var(--bg1); border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow: auto; box-shadow: 0 8px 30px rgba(0,0,0,.45); }
  #block-panel.open { display: block; }
  #editor-pane { position: relative; }
  .block { border-left: 5px solid var(--blurple); background: var(--bg3); border-radius: 6px; padding: 8px; margin: 8px 0; }
  .block.embed-block { border-left-color: var(--orange); }
  .block.button-block { border-left-color: var(--green); }
  .block label { display: block; color: var(--txt-dim); font-size: 11px; font-weight: 700; margin-bottom: 3px; }
  .block input { width: 100%; background: var(--bg0); color: var(--txt); border: 1px solid var(--border); border-radius: 4px; padding: 6px; margin-bottom: 6px; }
  .block-title { color: var(--txt-head); font-weight: 700; margin-bottom: 6px; }
  #block-preview { background: var(--bg0); border: 1px solid var(--border); padding: 8px; border-radius: 6px; margin: 8px 0; }

  /* ---------- editor pane ---------- */
  #editor-pane { background: var(--bg1); border-left: 1px solid var(--border); display: flex; flex-direction: column; min-width: 0; }
  #editor-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px;
                 border-bottom: 1px solid var(--border); color: var(--txt-head); font-weight: 700; }
  .view-settings { display: flex; align-items: center; gap: 5px; margin-left: 12px; }
  .view-settings label { color: var(--text-muted); font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .view-settings select { background: var(--background-tertiary); border: 1px solid var(--border); border-radius: 4px; color: var(--text-normal); font: inherit; font-size: 11px; padding: 4px 5px; }
  .view-settings select:focus, #act-as:focus { border-color: var(--brand-primary); outline: 2px solid rgba(88,101,242,.25); outline-offset: 1px; }
  body[data-density="compact"] #timeline .msg { padding-top: 2px; padding-bottom: 2px; }
  body[data-density="compact"] #timeline { padding-top: 8px; }
  body[data-message-display="compact"] #timeline .msg { gap: 8px; padding-top: 2px; padding-bottom: 2px; }
  body[data-message-display="compact"] #timeline .msg .avatar { width: 28px; height: 28px; font-size: 12px; }

  #scenario-panel { display: none; flex: none; flex-direction: column; gap: 6px; max-height: 270px; padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--bg2); }

  #jump-present { position: absolute; left: calc((100% - 180px) / 2 - 90px); bottom: 10px; transform: translateY(8px); opacity: 0; visibility: hidden; pointer-events: none; background: var(--brand-primary); color: #fff; border: 0; border-radius: 16px; padding: 7px 14px; font: inherit; font-size: 12px; font-weight: 700; z-index: 10; transition: opacity var(--motion-normal) var(--ease-decelerate), transform var(--motion-normal) var(--ease-decelerate); }
  #jump-present.open { opacity: 1; transform: translateY(0); visibility: visible; pointer-events: auto; }

  /* ---------- modal dialog ---------- */

                   justify-content: center; z-index: 50; transition: opacity var(--motion-fast) var(--ease-standard); }
  #modal-overlay.open, #modal-overlay.closing { visibility: visible; }

  @keyframes content-in { from { transform: translateY(4px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes unread-in { from { transform: scale(.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes run-pulse { 50% { opacity: .72; } }
  #modal-head { padding: 14px 16px; color: var(--txt-head); font-weight: 700; font-size: 18px; }
  #modal-body { padding: 4px 16px 8px; }
  .modal-field { margin-bottom: 14px; }

                       padding: 9px 10px; font: inherit; outline: none; }

              font: inherit; font-weight: 700; cursor: pointer; }

  /* Keep the desktop shell primary while collapsing secondary surfaces on small screens. */
  @media (max-width: 1200px) {
    #app { grid-template-columns: 280px 1fr 420px; }

    .msg.entering, .day-divider.entering, .channel-row .unread, body[data-running="true"] #btn-run { animation: none; }
  }

<body>
<div id="app">
  <nav id="server-rail" aria-label="Servers">
    <div class="server-icon active" title="ScriptPlayground local server" aria-label="ScriptPlayground local server">SP</div>
    <div class="server-separator"></div>
    <div class="server-icon" title="Offline local simulation" aria-label="Offline local simulation">⌘</div>
  </nav>

      <div class="avatar status-ring" id="me-avatar">Y</div>

      <label><span class="sr-only">Act as user</span><select id="act-as" title="Act as user"></select></label>
    </div>
  </nav>

  <main id="chat-pane">
  <header id="chat-head">
    <div id="chat-title"><span id="chat-head-name"># playground</span><span id="head-topic" hidden></span></div>
    <span class="desc" id="head-desc">Everything your script sends shows up here — live.</span>

    <a class="head-link" href="/embeder" target="_blank" title="Open the Components V2 builder">✦ Embeder</a>
    <a class="head-link" id="account-link" href="/auth/discord/login" title="Optional Discord identity sign-in">Sign in</a>
  </header>
  <div id="chat-content">
    <div id="timeline"></div>
    <button id="jump-present" type="button">Jump to present</button>
    <aside id="member-list" aria-label="Members"></aside>
  </div>
    <div id="composer">
      <div id="palette"></div>
      <div id="cmd-form"></div>
      <div id="composer-box">
        <span style="color:var(--txt-dim)">＋</span>
        <input id="composer-input" placeholder="Message #playground — type !ping, !hello, or / for commands"
               autocomplete="off" spellcheck="false">
        <span style="color:var(--txt-dim)">😀</span>
      </div>
    </div>
  </main>

  <aside id="editor-pane">
    <div id="workspace-bar">
      <label for="workspace-select">Bot folder</label>
      <select id="workspace-select"><option value="">connect a folder…</option></select>
      <button id="btn-connect" class="lib-btn" title="Load a bot folder from bots/">📂 Connect</button>
      <button id="btn-blocks" class="lib-btn" title="Edit a message visually with blocks">🧱 Blocks</button>
    </div>
    <div id="script-lib">
      <label for="script-select">Scripts</label>
      <select id="script-select"><option>loading…</option></select>
      <button id="btn-save" class="lib-btn" title="Save the editor contents into the library">Save</button>
      <button id="btn-delete" class="lib-btn" title="Delete the loaded script from the library">🗑</button>
      <button id="btn-suite" class="lib-btn" title="Run every saved script in isolated mock sessions">🧪 Test</button>
      <button id="btn-scenarios" class="lib-btn" title="Create and replay a saved interaction scenario">Scenarios</button>
      <button id="btn-design" class="lib-btn link-btn" title="Import a saved Components V2 design into the editor">✦ Design</button>
    </div>
    <section id="scenario-panel" aria-label="Scenario runner">
      <div id="scenario-tools">
        <label for="scenario-select" class="local-label">Saved scenarios</label>
        <select id="scenario-select"><option value="">New scenario…</option></select>
        <button id="scenario-load" class="lib-btn" type="button">Load</button>
        <button id="scenario-save" class="lib-btn" type="button">Save</button>
        <button id="scenario-run" class="lib-btn link-btn" type="button">▶ Run scenario</button>
      </div>
      <textarea id="scenario-json" spellcheck="false" aria-label="Scenario JSON">{
  "version": 1,
  "name": "Greeting",
  "steps": [
    {"action": "message", "content": "!hello", "as": "Alice"},
    {"assert": "message_exists", "content": "Hello, <@111111111111111111>!"}
  ]
}</textarea>
      <div id="scenario-results" aria-live="polite"></div>
    </section>
    <div id="block-panel" aria-label="Visual block editor">
      <div class="block-title">🧱 Live message blocks</div>
      <div class="block">Send message <input id="block-content" placeholder="Message text"></div>
      <div class="block embed-block">Embed
        <label for="block-title">Title</label><input id="block-title" placeholder="Embed title">
        <label for="block-description">Description</label><input id="block-description" placeholder="Embed description">

<script>
"use strict";
const $ = (sel) => document.querySelector(sel);
const timeline = $("#timeline"), consoleBody = $("#console-body"), inspector = $("#inspector");
let currentChannel = null;   // which channel's timeline we're viewing
const seenCounts = {};       // channel key -> count of seen messages
let SID = null, pollTimer = null, ws = null, lastRevision = "", lastModalKey = "";
let messageRows = new Map(), dayRows = new Map(), renderedChannel = null, emptyTimeline = null;
let previousShownIds = new Set(), timelinePainted = false, categoryCollapsed = false;
const unreadCounts = {};
const dismissedModals = new Set();
const AVATAR_COLORS = ["#5865f2","#3ba55d","#faa81a","#ed4245","#eb459e","#9b59b6"];
let lastState = null, cmdMode = null; // cmdMode: the command being composed
let libScripts = [];                  // the script library listing
const pickedValues = {};               // "mid|custom_id" -> [values], so selects keep state across re-renders
const viewSettings = {
    density: localStorage.getItem("pg-density") || "comfortable",
    messages: localStorage.getItem("pg-message-display") || "cozy",
  };
  function applyViewSettings() {
    document.body.dataset.density = viewSettings.density;
    document.body.dataset.messageDisplay = viewSettings.messages;
    $("#density-select").value = viewSettings.density;
    $("#message-display").value = viewSettings.messages;
  }
  $("#density-select").onchange = (event) => {
    viewSettings.density = event.target.value;
    localStorage.setItem("pg-density", viewSettings.density);
    applyViewSettings();
  };
  $("#message-display").onchange = (event) => {
    viewSettings.messages = event.target.value;
    localStorage.setItem("pg-message-display", viewSettings.messages);
    applyViewSettings();
    if (lastState) { lastRevision = ""; render(lastState); }
  };
  applyViewSettings();

/* ---------------- boot ---------------- */
async function boot() {
  const res = await fetch("/api/session", { method: "POST" });
  const data = await res.json();
  SID = data.sid;
  if (data.example && !localStorage.getItem("pg-code")) $("#code").value = data.example;
  else $("#code").value = localStorage.getItem("pg-code") || "";
  connectWS();
  render(data.state);
  loadAuthStatus();
  loadLibrary();
  loadWorkspaces();
}
function flushLocalState() {
  localStorage.setItem("pg-code", $("#code").value);
  const design = localStorage.getItem("discord-embeder:autosave:v1");
  if (design !== null) localStorage.setItem("discord-embeder:autosave:v1", design);
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") flushLocalState();
});
window.addEventListener("beforeunload", flushLocalState);
async function loadAuthStatus() {
  const link = $("#account-link");
  try {
    const response = await fetch("/api/auth/status");
    const data = await response.json();
    if (!data.configured) {
      link.textContent = "Offline mode";
      link.href = "#";
      link.title = "Discord sign-in is optional and not configured";
      link.onclick = (event) => event.preventDefault();
    } else if (data.authenticated) {
      link.textContent = `Signed in as ${data.user.username}`;
      link.href = "/auth/logout";
      link.title = "Sign out of Discord identity session";
    } else {
      link.textContent = "Sign in with Discord";
    }
  } catch (_) {
    link.textContent = "Offline mode";
    link.href = "#";
    link.onclick = (event) => event.preventDefault();
  }
}

function startPolling() {
  if (!pollTimer) pollTimer = setInterval(refresh, 2000);
}
function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}
function connectWS() {
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/api/session/${SID}/ws`);
  ws.onopen = stopPolling;
  ws.onmessage = (ev) => {
    try { if (JSON.parse(ev.data).type === "update") refresh(); } catch (_) { /* ignore malformed nudges */ }
  };
  ws.onerror = startPolling;
  ws.onclose = () => { startPolling(); setTimeout(connectWS, 3000); };
  // Poll during the connection handshake so a blocked websocket never stalls the UI.
  startPolling();
}
async function refresh() {
  const res = await fetch(`/api/session/${SID}/state`);
  if (res.ok) render(await res.json());
}

/* ---------------- rendering ---------------- */
function render(st) {
  if (!st || st.ok === false) return;
  lastState = st;
  document.body.dataset.running = String(Boolean(st.running));
  renderRunError(st.last_run);
  $("#guild-name").textContent = st.guild.name;
  $("#me-name").textContent = st.user.name;
  $("#me-sub").textContent = st.running ? "runtime live" : "not running — press Run";
  $("#sim-context").textContent = `LOCAL · ACTING AS ${st.user.name.toUpperCase()}`;
  const activeUser = (st.users || []).find((user) => user.id == st.user.id) || st.user;
  const activeIndex = (st.users || []).findIndex((user) => user.id == st.user.id);
  const avatar = $("#me-avatar");
  avatar.textContent = (activeUser.name || "?")[0].toUpperCase();
  avatar.style.background = AVATAR_COLORS[(activeIndex < 0 ? 0 : activeIndex) % AVATAR_COLORS.length];
  const actAs = $("#act-as");
  actAs.innerHTML = "";
  for (const user of st.users || []) actAs.appendChild(new Option(user.name, user.id));
  actAs.value = String(st.user.id);
  if (!currentChannel || !st.channels.some((c) => c.id == currentChannel)) {
    currentChannel = st.channels.length ? st.channels[0].id : null;
  }
  renderChannels(st);
  renderMembers(st);
  renderInspector(st);

  const shown = st.messages.filter((m) => !m.deleted && (m.channel == currentChannel || (!m.channel && currentChannel === st.channels[0]?.id)));
  const chatKey = `${st.revision}|${currentChannel}`;
  if (chatKey === lastRevision) return;
  const stick = timeline.scrollHeight - timeline.scrollTop - timeline.clientHeight < 200;
  const channelChanged = renderedChannel !== currentChannel;
  if (channelChanged) {
    timeline.replaceChildren();
    messageRows.clear();
    dayRows.clear();
    emptyTimeline = null;
    previousShownIds = new Set();
    renderedChannel = currentChannel;
    timelinePainted = false;
  }
  const shownIds = new Set(shown.map((message) => message.id));
  for (const [id, row] of messageRows) {
    if (!shownIds.has(id)) {
      row.remove();
      messageRows.delete(id);
    }
  }
  for (const [day, row] of dayRows) {
    if (!shown.some((message) => messageDay(message) === day)) {
      row.remove();
      dayRows.delete(day);
    }
  }
  if (shown.length && emptyTimeline) {
    emptyTimeline.remove();
    emptyTimeline = null;
  }
  const desired = [];
  let previous = null;
  let previousDay = null;
  for (const message of shown) {
    const day = messageDay(message);
    let divider = dayRows.get(day);
    if (!divider) {
      divider = document.createElement("div");
      divider.className = "day-divider" + (timelinePainted ? " entering" : "");
      divider.textContent = day;
      dayRows.set(day, divider);
      if (timelinePainted) divider.addEventListener("animationend", () => divider.classList.remove("entering"), { once: true });
    }
    if (day !== previousDay) desired.push(divider);
    const grouped = viewSettings.messages === "cozy" && previous && canGroupMessages(previous, message);
    const fingerprint = messageFingerprint(message, grouped);
    let row = messageRows.get(message.id);
    const isNew = !row;
    if (!row) {
      row = renderMessage(message, st, grouped);
      messageRows.set(message.id, row);
    } else if (row.dataset.fingerprint !== fingerprint) {
      updateMessageRow(row, message, st, grouped);
    }
    row.dataset.fingerprint = fingerprint;
    row.classList.toggle("grouped", grouped);
    if (isNew && timelinePainted) {
      row.classList.add("entering");
      row.addEventListener("animationend", () => row.classList.remove("entering"), { once: true });
    } else if (!isNew) {
      row.classList.remove("entering");
    }
    desired.push(row);
    previous = message;
    previousDay = day;
  }
  if (!shown.length) {
    if (!emptyTimeline) {
      emptyTimeline = document.createElement("div");
      emptyTimeline.className = "day-divider";
      emptyTimeline.textContent = "#" + channelName(st) + " — no messages here yet";
    }
    desired.push(emptyTimeline);
  }
  // Reconcile keyed nodes in place. Existing rows stay in the DOM; only a new
  // row/divider is inserted, or a changed row's children are refreshed above.
  for (let index = 0; index < desired.length; index += 1) {
    const node = desired[index];
    if (timeline.children[index] !== node) timeline.insertBefore(node, timeline.children[index] || null);
  }
  while (timeline.children.length > desired.length) timeline.lastElementChild.remove();
  const newMessageArrived = [...shownIds].some((id) => !previousShownIds.has(id));
  if (newMessageArrived && !stick && timelinePainted) $("#jump-present").classList.add("open");
  if (stick) {
    timeline.scrollTop = timeline.scrollHeight;
    $("#jump-present").classList.remove("open");
  }
  previousShownIds = shownIds;
  timelinePainted = true;
  lastRevision = chatKey;

  const mk = JSON.stringify(st.modals);
  if (mk !== lastModalKey) {
    lastModalKey = mk;
    const pending = st.modals.find((mo) => !dismissedModals.has(mo.id));
    if (pending && !activeModal) openModal(pending);
  }
  consoleBody.innerHTML = "";
  for (const e of st.events) {
    const line = document.createElement("div");
    line.className = "console-line" + (e.cls ? " " + e.cls : "");
    line.textContent = `${e.icon} ${e.text}`;
    consoleBody.appendChild(line);
  }
  consoleBody.scrollTop = consoleBody.scrollHeight;
  if (st.last_run) {
    $("#run-stats").textContent = `— ${st.last_run.ms.toFixed(0)} ms ${st.last_run.ok ? "" : "· error"}`;
  }
}

function messageDay(message) {
  return (message.timestamp || "").slice(0, 10) || "Today";
}
function canGroupMessages(previous, current) {
  if (previous.author.id !== current.author.id || previous.author.bot !== current.author.bot) return false;
  const a = Date.parse(previous.timestamp || ""), b = Date.parse(current.timestamp || "");
  return messageDay(previous) === messageDay(current) && Number.isFinite(a) && Number.isFinite(b) && b - a <= 5 * 60 * 1000;
}
function messageFingerprint(message, grouped) {
  return JSON.stringify([message.author, message.channel, message.command, message.timestamp,
    message.content, message.embeds, message.components, message.v2, message.files,
    message.ephemeral, message.deleted, message.revision, grouped]);
}
function updateMessageRow(row, message, st, grouped) {
  const fresh = renderMessage(message, st, grouped);
  row.className = fresh.className;
  row.replaceChildren(...fresh.childNodes);
}
$("#jump-present").onclick = () => {
  timeline.scrollTop = timeline.scrollHeight;
  $("#jump-present").classList.remove("open");
};
timeline.addEventListener("scroll", () => {
  if (timeline.scrollHeight - timeline.scrollTop - timeline.clientHeight < 200) $("#jump-present").classList.remove("open");
});

let inspectorMode = "console";
let expandedInspectorEntry = null;

function setInspector(mode, entryId = null) {
  inspectorMode = mode;
  expandedInspectorEntry = entryId && entryId !== "permissions" ? `${mode}:${entryId}` : null;
  document.querySelectorAll("[data-inspector]").forEach((tab) =>
    tab.classList.toggle("active", tab.dataset.inspector === mode));
  renderInspector(lastState);
  if (mode === "state" && entryId === "permissions") {
    requestAnimationFrame(() => $("#inspect-permissions")?.scrollIntoView({ block: "start" }));
  } else if (entryId && mode !== "state") {
    requestAnimationFrame(() => inspector.querySelector(".inspect-entry[aria-expanded='true']")?.scrollIntoView({ block: "nearest" }));
  }
}

function toolLink(label, mode, entryId = null) {
  const button = document.createElement("button");
  button.className = "tool-link";
  button.type = "button";
  button.textContent = label;
  button.onclick = (event) => { event.stopPropagation(); setInspector(mode, entryId); };
  return button;
}

function renderInspector(st) {
  const showInspector = inspectorMode !== "console";
  consoleBody.style.display = showInspector ? "none" : "block";
  inspector.style.display = showInspector ? "block" : "none";
  if (!showInspector) return;
  const events = (st.events || []).filter((entry) =>
    inspectorMode === "actions" ? entry.kind === "action" : entry.kind === "event");
  if (inspectorMode === "state") {
    const cards = [
      ["Active user", st.user.name], ["Bot", st.bot.name],
      ["Channel", "#" + st.channel.name], ["Messages", st.messages.length],
      ["Commands", Object.keys(st.commands || {}).length], ["Open modals", st.modals.length],
    ];
    inspector.innerHTML = `<div class="inspect-grid">${cards.map(() =>
      `<div class="inspect-card"><div class="inspect-label"></div><div class="inspect-value"></div></div>`).join("")}</div>`;
    inspector.querySelectorAll(".inspect-card").forEach((card, index) => {
      card.querySelector(".inspect-label").textContent = cards[index][0];
      card.querySelector(".inspect-value").textContent = cards[index][1];
    });
    const users = (st.users || []).map((user) => user.name).join(", ") || "none";
    const channels = (st.channels || []).map((channel) => "#" + channel.name).join(", ") || "none";
    inspector.insertAdjacentHTML("beforeend", `<div class="inspect-section">Simulated users</div><div class="inspect-list" id="inspect-users"></div><div class="inspect-section">Channels</div><div class="inspect-list" id="inspect-channels"></div><div class="inspect-section">Permissions</div><div class="inspect-list" id="inspect-permissions"></div><div class="inspect-section">State snapshot</div><div class="inspect-json" id="inspect-json"></div>`);
    $("#inspect-users").textContent = users;
    $("#inspect-channels").textContent = channels;
    const permissionList = $("#inspect-permissions");
    for (const [label, values] of Object.entries(st.permissions || {})) {
      const heading = document.createElement("div");
      heading.className = "inspect-label";
      heading.textContent = label === "user" ? `Active user: ${st.user.name}` : "Bot app permissions";
      permissionList.appendChild(heading);
      for (const [name, result] of Object.entries(values)) {
        const row = document.createElement("div");
        row.className = "permission-row";
        row.innerHTML = `<span class="permission-name"></span><span class="permission-result"></span><span class="permission-reason"></span>`;
        row.querySelector(".permission-name").textContent = name;
        row.querySelector(".permission-result").textContent = result.allowed ? "allowed" : "denied";
        row.querySelector(".permission-result").classList.add(result.allowed ? "allowed" : "denied");
        row.querySelector(".permission-reason").textContent = result.reason;
        permissionList.appendChild(row);
      }
    }
    $("#inspect-json").textContent = JSON.stringify({
      active_user: st.user, bot: st.bot, channel: st.channel,
      running: st.running, revision: st.revision,
      recent_events: (st.events || []).slice(-8),
    }, null, 2);
    return;
  }
  inspector.innerHTML = `<div class="inspect-section">${inspectorMode === "actions" ? "Simulated API operations" : "Runtime events"}</div><div id="inspect-entries"></div>`;
  const list = $("#inspect-entries");
  if (!events.length) {
    expandedInspectorEntry = null;
    list.innerHTML = `<div class="inspect-empty">${inspectorMode === "actions" ? "Run or interact with a script to see simulated API operations here." : "Run a script or interact with the chat to see events here."}</div>`;
    return;
  }
  const visibleEntryIds = new Set(events.map((entry) => `${inspectorMode}:${entry.id || JSON.stringify([entry.icon, entry.kind, entry.text, entry.details])}`));
  if (expandedInspectorEntry && !visibleEntryIds.has(expandedInspectorEntry)) expandedInspectorEntry = null;
  for (const [position, entry] of events.slice().reverse().entries()) {
    const entryId = entry.id || JSON.stringify([entry.icon, entry.kind, entry.text, entry.details]);
    const key = `${inspectorMode}:${entryId}`;
    const row = document.createElement("button");
    row.className = "inspect-entry";
    row.type = "button";
    row.setAttribute("aria-expanded", String(expandedInspectorEntry === key));
    row.innerHTML = `<span class="inspect-entry-icon"></span><span class="inspect-entry-copy"><span class="inspect-entry-kind"></span><span class="inspect-entry-text"></span></span>`;
    row.querySelector(".inspect-entry-icon").textContent = entry.icon || "•";
    row.querySelector(".inspect-entry-kind").textContent = entry.kind || "event";
    row.querySelector(".inspect-entry-text").textContent = entry.text || "(unnamed entry)";
    const detail = document.createElement("div");
    detail.className = `inspect-detail${expandedInspectorEntry === key ? " open" : ""}`;
    detail.id = `inspect-detail-${position}`;
    const detailBody = document.createElement("div");
    detailBody.className = "inspect-detail-body";
    const metadata = document.createElement("div");
    metadata.className = "inspect-meta";
    const details = entry.details || {};
    for (const [label, value] of [["Time", entry.timestamp], ["Actor", details.actor],
      ["Channel", details.channel && `#${details.channel}`],
      ["Target", details.message_id && `message ${details.message_id}`]]) {
      if (!value) continue;
      const item = document.createElement("span");
      item.textContent = `${label}: ${value}`;
      metadata.appendChild(item);
    }
    if (metadata.childNodes.length) detailBody.appendChild(metadata);
    const json = document.createElement("pre");
    json.textContent = JSON.stringify(details.text ? details : { ...details, text: entry.text }, null, 2);
    detailBody.appendChild(json);
    const links = document.createElement("div");
    links.className = "inspect-links";
    if (inspectorMode === "events") {
      for (const actionId of entry.action_ids || []) {
        const action = (st.events || []).find((candidate) => candidate.id === actionId);
        if (action) links.appendChild(toolLink(`Inspect ${action.details?.operation || "action"}`, "actions", action.id));
      }
    } else {
      const triggeringEvent = entry.event_id && (st.events || []).find((candidate) => candidate.id === entry.event_id);
      if (triggeringEvent) links.appendChild(toolLink("Inspect triggering event", "events", triggeringEvent.id));
      for (const actionId of entry.action_ids || []) {
        const action = (st.events || []).find((candidate) => candidate.id === actionId);
        if (action) links.appendChild(toolLink(`Inspect ${action.details?.operation || "action"}`, "actions", action.id));
      }
    }
    links.appendChild(toolLink("Inspect State", "state"));
    detailBody.appendChild(links);
    detail.appendChild(detailBody);
    row.setAttribute("aria-controls", detail.id);
    row.onclick = () => {
      expandedInspectorEntry = expandedInspectorEntry === key ? null : key;
      renderInspector(lastState);
    };
    list.append(row, detail);
  }
}

document.querySelectorAll("[data-inspector]").forEach((button) => {

window.addEventListener("click", (event) => {

function renderMessage(m, st, grouped = false) {
  const row = document.createElement("div");
  row.className = "msg" + (grouped ? " grouped" : "");
  row.dataset.messageId = m.id;
  const av = document.createElement("div");
  av.className = "avatar";
  av.style.background = AVATAR_COLORS[m.author.id % AVATAR_COLORS.length];
  av.textContent = m.author.name[0].toUpperCase();
  const body = document.createElement("div");
  body.className = "msg-body";

  const head = document.createElement("div");
  head.innerHTML = `<span class="msg-author"></span>` +
    (m.author.bot ? `<span class="bot-tag">APP</span>` : "") +
    `<span class="msg-time">${(m.timestamp || "").slice(11, 16)}</span>`;
  head.querySelector(".msg-author").textContent = m.author.name;
  body.appendChild(head);
  if (m.command) {
    const chip = document.createElement("span");
    chip.className = "cmd-chip msg-chip";
    chip.textContent = `/` + m.command;
    body.insertBefore(chip, body.firstChild);
  }

  if (m.content) {
    const c = document.createElement("div");
    c.className = "msg-content";
    c.innerHTML = fmt(m.content, st);
    body.appendChild(c);
  }
  mediaFiles = m.files || [];  // for attachment:// resolution in embeds

  // Files referenced as attachment:// in an embed become its media and are not
  // shown as separate attachment cards (matches real Discord).
  const consumed = new Set();
  for (const e of m.embeds || []) {
    for (const u of [e.image && e.image.url, e.thumbnail && e.thumbnail.url]) {
      if (u && u.startsWith("attachment://")) consumed.add(u.slice("attachment://".length));
    }
  }
  for (const e of m.embeds || []) body.appendChild(renderEmbed(e, st));
  for (const f of m.files || []) {
    if (consumed.has(f.name)) continue;
    if (f.data_uri) {
      const wrap = document.createElement("div");
      wrap.className = "attach-thumb-wrap";
      const img = document.createElement("img");
      img.className = "attach-thumb";
      img.src = f.data_uri;
      img.alt = f.name;
      const name = document.createElement("div");
      name.className = "attach-name";
      name.textContent = f.name;
      wrap.appendChild(img); wrap.appendChild(name);
      body.appendChild(wrap);
    } else {
      const a = document.createElement("div");
      a.className = "attachment";
      a.textContent = `📎 ${f.name}`;
      body.appendChild(a);
    }
  }
  if (m.components && m.components.length) body.appendChild(renderComponents(m, st));
  if (m.v2 && m.v2.length) body.appendChild(renderV2(m, st));
  if (m.ephemeral) {
    const note = document.createElement("div");
    note.className = "ephemeral-note";
    note.textContent = "Only visible to you (ephemeral)";
    body.appendChild(note);
  }
  const rev = document.createElement("span");
  rev.className = "edited-note";
  rev.textContent = m.revision > 0 ? `(edited ×${m.revision})` : "";
  head.appendChild(rev);

  const actions = document.createElement("div");
  actions.className = "msg-actions";
  const copy = document.createElement("button");
  copy.className = "msg-action";
  copy.type = "button";
  copy.textContent = "Copy";
  copy.title = "Copy message text";
  copy.onclick = () => copyMessage(m);
  actions.appendChild(copy);
  const more = document.createElement("div");
  more.className = "msg-more";
  const moreButton = document.createElement("button");
  moreButton.className = "msg-action";
  moreButton.type = "button";
  moreButton.textContent = "More";
  moreButton.title = "Inspect related runtime details";
  moreButton.setAttribute("aria-haspopup", "menu");
  moreButton.setAttribute("aria-expanded", "false");
  const menu = document.createElement("div");
  menu.className = "msg-inspect-menu";
  menu.setAttribute("role", "menu");
  const entries = st.events || [];
  const directActions = entries.filter((entry) => entry.kind === "action" && entry.details?.message_id === m.id);
  const directActionIds = new Set(directActions.map((entry) => entry.id));
  const relatedEvent = entries.slice().reverse().find((entry) => entry.kind === "event" && (
    entry.details?.message_id === m.id || (entry.action_ids || []).some((id) => directActionIds.has(id)) ||
    directActions.some((action) => action.event_id === entry.id)
  ));
  const relatedActionIds = new Set([...directActionIds, ...(relatedEvent?.action_ids || [])]);
  const relatedActions = entries.filter((entry) => entry.kind === "action" && relatedActionIds.has(entry.id));
  const menuItems = [
    ["Inspect event", "events", relatedEvent?.id || null],
    ["Inspect action", "actions", relatedActions.at(-1)?.id || null],
    ["Inspect permissions", "state", "permissions"],
  ];
  for (const [label, mode, id] of menuItems) {
    const item = document.createElement("button");
    item.type = "button";
    item.textContent = label;
    item.setAttribute("role", "menuitem");
    item.className = "tool-link";
    if (!id && mode !== "state") {
      item.disabled = true;
      item.title = "No related runtime entry was retained for this message";
    }
    item.onclick = (event) => {
      event.stopPropagation();
      menu.classList.remove("open");
      moreButton.setAttribute("aria-expanded", "false");
      moreButton.focus();
      setInspector(mode, id || null);
    };
    menu.appendChild(item);
  }
  const closeMenu = () => {
    menu.classList.remove("open");
    moreButton.setAttribute("aria-expanded", "false");
  };
  menu.addEventListener("keydown", (event) => {
    if (event.key === "Escape") { closeMenu(); moreButton.focus(); return; }
    const items = [...menu.querySelectorAll("button:not(:disabled)")];
    if (!items.length) return;
    const current = items.indexOf(document.activeElement);
    let next = null;
    if (event.key === "ArrowDown") next = (current + 1) % items.length;
    else if (event.key === "ArrowUp") next = (current - 1 + items.length) % items.length;
    else if (event.key === "Home") next = 0;
    else if (event.key === "End") next = items.length - 1;
    if (next !== null) { event.preventDefault(); items[next].focus(); }
  });
  moreButton.onclick = (event) => {
    event.stopPropagation();
    const open = !menu.classList.contains("open");
    menu.classList.toggle("open", open);
    moreButton.setAttribute("aria-expanded", String(open));
    if (open) menu.querySelector("button:not(:disabled)")?.focus();
  };
  moreButton.onkeydown = (event) => {
    if (event.key === "ArrowDown" && !menu.classList.contains("open")) {
      event.preventDefault();
      moreButton.click();
    }
  };
  more.append(moreButton, menu);
  actions.appendChild(more);
  row.appendChild(av); row.appendChild(body); row.appendChild(actions);
  return row;
}

async function copyMessage(message) {
  try {
    await navigator.clipboard.writeText(message.content || "");
    $("#run-stats").textContent = "— message copied";
  } catch (_) {
    pgAlert("Copy is unavailable in this browser context.");
  }
}

function fmt(text, st) {
  let html = text
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  // Mentions: <@id> <@!id> <@&id> resolve against member/role fixtures; <#id> to a channel.
  // Note: '&' is escaped to '&amp;' before this runs, so the role prefix appears as '@&amp;'.
  html = html.replace(/&lt;(@!?|@&(amp;)?|#)(\d{17,20})&gt;/g, (_, rawPrefix, _amp, id) => {
    const prefix = rawPrefix === "@&" || rawPrefix === "@&amp;" ? "@&" : rawPrefix;
    const names = (st && st.members) || {};
    const name = names[prefix === "#" ? `#${id}` : id] || names[`&${id}`];
    const shown = name || (prefix === "#" ? "unknown-channel" : "unknown-user");
    const mark = prefix === "@&" ? "@" : prefix === "#" ? "#" : "@";
    return `<span class="mention">${mark}${shown}</span>`;
  });
  html = html.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
             .replace(/\*(.+?)\*/g, "<i>$1</i>")
             .replace(/__(.+?)__/g, "<u>$1</u>")
             .replace(/`([^`\n]+?)`/g, "<code class='embed-code'>$1</code>");
  return html;
}

function resolveMedia(url) {
  // Real https URLs pass through; attachment:// refs resolve against the message's files.
  if (!url) return null;
  if (url.startsWith("attachment://")) {
    const name = url.slice("attachment://".length);
    return (mediaFiles || []).find((f) => f.name === name)?.data_uri || null;
  }
  return url.startsWith("http") ? url : null;
}
let mediaFiles = [];

function renderEmbed(e, st) {
  const wrap = document.createElement("div");
  wrap.className = "embed";
  const bar = document.createElement("div");

  const inner = document.createElement("div");

    inner.appendChild(a);
  }
  if (e.title) {

    inner.appendChild(t);
  }
  if (e.description) {

    inner.appendChild(d);
  }
  if (e.fields && e.fields.length) {

    for (const f of e.fields) {
      const fd = document.createElement("div");
      fd.className = "embed-field" + (f.inline ? " inline" : "");
      fd.innerHTML = `<div class="embed-field-name"></div><div class="embed-field-value"></div>`;
      fd.querySelector(".embed-field-name").textContent = f.name;

  if (e.footer && e.footer.text) {
    const ft = document.createElement("div"); ft.className = "embed-footer"; ft.textContent = e.footer.text;
    inner.appendChild(ft);
  }
  wrap.appendChild(bar);
  const right = document.createElement("div");
  right.className = "embed-right";
  const bodyWrap = document.createElement("div");
  bodyWrap.className = "embed-body";
  bodyWrap.appendChild(inner);
  if (e.thumbnail && e.thumbnail.url) {
    const thumb = resolveMedia(e.thumbnail.url);
    if (thumb) {
      const t = document.createElement("img");

      bodyWrap.appendChild(t);

  wrap.appendChild(right);
  return wrap;
}

/* ---------------- components ---------------- */
const BTN_STYLE = { 1: "btn-1", 2: "btn-2", 3: "btn-3", 4: "btn-4", 5: "btn-5" };

/* Components V2 (LayoutView) — recursive layout tree */
function renderV2(m, st) {
  const root = document.createElement("div");
  root.className = "v2-root";
  for (const node of m.v2) root.appendChild(renderV2Node(m, node, st));
  return root;
}

function renderV2Node(m, node, st) {
  switch (node.v2) {
    case "container": {
      const box = document.createElement("div");
      box.className = "v2-container" + (node.spoiler ? " v2-spoiler" : "");
      if (node.accent_color) box.style.borderLeftColor = "#" + node.accent_color.toString(16).padStart(6, "0");
      for (const child of node.children || []) box.appendChild(renderV2Node(m, child, st));
      return box;
    }
    case "section": {
      const box = document.createElement("div");
      box.className = "v2-section";
      const texts = document.createElement("div");
      texts.className = "v2-section-texts";
      for (const child of node.children || []) texts.appendChild(renderV2Node(m, child, st));
      box.appendChild(texts);
      if (node.accessory) {
        const acc = renderV2Node(m, node.accessory, st);
        acc.classList.add("v2-accessory");
        box.appendChild(acc);
      }
      return box;
    }
    case "text": {
      const d = document.createElement("div");
      d.className = "v2-text";
      d.innerHTML = fmt(node.content || "", st);
      return d;
    }
    case "thumbnail": {
      const src = resolveMedia(node.url);
      if (!src) return document.createElement("span");
      const img = document.createElement("img");
      img.className = "v2-thumb" + (node.spoiler ? " v2-spoiler" : "");
      img.src = src; img.alt = node.description || "";
      return img;
    }
    case "gallery": {
      const row = document.createElement("div");
      row.className = "v2-gallery";
      for (const g of node.items || []) {
        const src = resolveMedia(g.url);
        if (!src) continue;
        const img = document.createElement("img");
        img.className = "v2-gallery-img" + (g.spoiler ? " v2-spoiler" : "");
        img.src = src; img.alt = g.description || "";
        row.appendChild(img);
      }
      return row;
    }
    case "file": {
      const a = document.createElement("a");
      a.className = "attachment" + (node.spoiler ? " v2-spoiler-inline" : "");
      a.href = resolveMedia(node.url) || "#";
      a.textContent = `📎 ${node.url.replace("attachment://", "")}`;
      return a;
    }
    case "separator": {
      if (!node.visible) return document.createElement("div");
      const sep = document.createElement("div");
      sep.className = "v2-separator" + (node.spacing === 2 ? " large" : "");
      return sep;
    }
    case "actionrow": {
      const row = document.createElement("div");
      row.className = "comp-row";
      for (const child of node.children || []) row.appendChild(renderV2Node(m, child, st));
      return row;
    }
    // Buttons/selects inside V2 reuse the classic renderers.
    default: {
      if (node.kind) return renderItem(m, node, st);
      const fallback = document.createElement("div");
      fallback.className = "v2-text";
      fallback.textContent = node.label || "(unknown component)";
      return fallback;
    }
  }
}

function renderComponents(m, st) {
  const rows = {};
  for (const item of m.components) (rows[item.row ?? 0] ??= []).push(item);
  const root = document.createElement("div");
  for (const rowNum of Object.keys(rows).sort()) {
    const rowEl = document.createElement("div");
    rowEl.className = "comp-row";
    for (const item of rows[rowNum]) rowEl.appendChild(renderItem(m, item, st));
    root.appendChild(rowEl);
  }
  return root;
}

function renderItem(m, item, st) {
  if (item.kind === "button") {
    if (item.url) {
      const a = document.createElement("a");
      a.className = "btn btn-link"; a.href = item.url; a.target = "_blank"; a.rel = "noopener";
      a.textContent = (item.emoji ? item.emoji + " " : "") + (item.label || item.url);
      return a;
    }
    const b = document.createElement("button");
    b.className = "btn " + (BTN_STYLE[item.style] || "btn-2");
    b.textContent = (item.emoji ? item.emoji + " " : "") + (item.label || item.custom_id);
    b.disabled = item.disabled;
    b.onclick = () => click(m.id, item.custom_id, []);
    return b;
  }
  if (item.kind === "select") {
    const multi = item.max_values > 1;
    const wrap = document.createElement("div"); wrap.className = "select-wrap";
    const sel = document.createElement("select");
    sel.className = "sel" + (multi ? " multi" : "");
    sel.disabled = item.disabled;
    sel.multiple = multi;
    if (multi) sel.size = Math.min(Math.max(item.options.length, 2), 5);
    const picked = pickedValues[m.id + "|" + item.custom_id] || [];
    if (!multi) {
      const ph = document.createElement("option");
      ph.textContent = item.placeholder || "Make a selection"; ph.value = ""; ph.disabled = true;
      ph.selected = picked.length === 0;
      sel.appendChild(ph);
    }
    for (const o of item.options || []) {
      const opt = document.createElement("option");
      opt.value = o.value; opt.textContent = (o.emoji ? o.emoji + " " : "") + o.label +
        (o.description ? ` — ${o.description}` : "");
      if (multi) opt.selected = picked.includes(o.value);
      sel.appendChild(opt);
    }
    sel.onchange = () => {
      const values = multi
        ? [...sel.selectedOptions].map((o) => o.value)
        : [sel.value];
      if (values.length && values[0] !== "") {
        pickedValues[m.id + "|" + item.custom_id] = values;
        click(m.id, item.custom_id, values);
      }
    };
    wrap.appendChild(sel);
    return wrap;
  }
  // user_select / role_select / channel_select / mentionable_select: option lists come from fixtures
  const wrap = document.createElement("div"); wrap.className = "select-wrap";
  const sel = document.createElement("select");
  sel.className = "sel picker";
  sel.disabled = item.disabled;
  const picked = pickedValues[m.id + "|" + item.custom_id] || [];
  const ph = document.createElement("option");
  ph.textContent = item.placeholder || { user_select: "Select a user", role_select: "Select a role",
    channel_select: "Select a channel", mentionable_select: "Select" }[item.kind] || "Make a selection";
  ph.value = ""; ph.disabled = true;
  ph.selected = picked.length === 0;
  sel.appendChild(ph);
  const options = [];
  if (item.kind === "user_select" || item.kind === "mentionable_select") {
    for (const [id, name] of Object.entries(st.members || {})) {
      if (!id.startsWith("&")) options.push({ value: id, label: "@" + name });
    }
  }
  if (item.kind === "role_select" || item.kind === "mentionable_select") {
    for (const [id, name] of Object.entries(st.members || {})) {
      if (id.startsWith("&")) options.push({ value: id.slice(1), label: "@" + name });
    }
  }
  if (item.kind === "channel_select") {
    options.push({ value: st.channel.id, label: "#" + st.channel.name });
  }
  for (const o of options) {
    const opt = new Option(o.label, o.value);
    if (picked.includes(o.value)) opt.selected = true;
    sel.appendChild(opt);
  }
  sel.onchange = () => {
    if (sel.value) {
      pickedValues[m.id + "|" + item.custom_id] = [sel.value];
      click(m.id, item.custom_id, [sel.value]);
    }
  };
  wrap.appendChild(sel);
  return wrap;
}

/* ---------------- actions ---------------- */
async function post(path, body) {
  const res = await fetch(`/api/session/${SID}/${path}`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  if (res.ok) { render(await res.json()); }
}
const click = (mid, cid, values) => post("click", { message_id: mid, custom_id: cid, values });
let userChange = 0;
$("#act-as").onchange = async () => {
  const select = $("#act-as");
  const previous = String(lastState?.user.id ?? select.value);
  const attempt = ++userChange;
  const res = await fetch(`/api/session/${SID}/user`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user_id: select.value }),
  });

    pgAlert(data.error || "Could not switch user");

};

/* modal dialog */
let activeModal = null;
function openModal(modal) {
  activeModal = modal;
  $("#modal-head").textContent = modal.title || "Modal";
  const body = $("#modal-body"); body.innerHTML = "";
  for (const item of modal.items) {
    const f = document.createElement("div"); f.className = "modal-field";
    const label = document.createElement("label");
    label.innerHTML = `<span></span>${item.required ? ' <span class="req">*</span>' : ""}`;
    label.querySelector("span").textContent = item.label || item.custom_id;
    const input = document.createElement("input");
    input.dataset.cid = item.custom_id;
    input.value = item.value || "";
    input.maxLength = item.max_length || 4000;
    if (item.style === 2) { input.size = 40; }
    input.placeholder = item.placeholder || "";
    f.appendChild(label); f.appendChild(input);
    if (item.min_length) {
      const hint = document.createElement("div"); hint.className = "modal-hint";
      hint.textContent = `Between ${item.min_length} and ${item.max_length} characters.`;
      f.appendChild(hint);
    }
    body.appendChild(f);
  }
  const overlay = $("#modal-overlay");
  overlay.classList.remove("closing");
  overlay.classList.add("open");
  body.querySelector("input")?.focus();
}
function closeModal(submit) {
  if (!activeModal) return;
  const values = {};
  if (submit) {
    for (const input of $("#modal-body").querySelectorAll("input")) {
      values[input.dataset.cid] = input.value;
    }
  }
  const modal = activeModal;
  activeModal = null;
  const overlay = $("#modal-overlay");
  overlay.classList.remove("open");
  overlay.classList.add("closing");
  setTimeout(() => overlay.classList.remove("closing"), 100);
  if (submit) post("submit", { modal_id: modal.id, values });
  else dismissedModals.add(modal.id);
}
$("#modal-ok").onclick = () => closeModal(true);
$("#modal-cancel").onclick = () => closeModal(false);
$("#modal-overlay").onclick = (e) => { if (e.target.id === "modal-overlay") closeModal(false); };
document.addEventListener("keydown", (e) => {
  if (!$("#modal-overlay").classList.contains("open")) return;
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); closeModal(true); }
  if (e.key === "Escape") closeModal(false);
});

function renderMembers(st) {
  const list = $("#member-list");
  list.innerHTML = "";
  const details = st.member_details || Object.entries(st.members || {})
    .filter(([id]) => id.length > 0 && [...id].every((char) => char >= "0" && char <= "9"))
    .map(([id, name]) => ({ id, name, status: "online", bot: id === String(st.bot.id) }));
  const online = details.filter((member) => !["offline", "invisible"].includes(member.status));
  const offline = details.filter((member) => ["offline", "invisible"].includes(member.status));
  const addGroup = (title, members, offset) => {
    const group = document.createElement("div");
    group.className = "member-group";
    group.textContent = `${title} — ${members.length}`;
    list.appendChild(group);
    members.forEach((member, index) => {
      const row = document.createElement("div");
      row.className = "member-row";
      const avatar = document.createElement("div");
      avatar.className = "member-avatar";
      avatar.dataset.status = member.status || "online";
      avatar.style.background = member.bot ? "var(--brand-primary)"
        : (member.role_color || AVATAR_COLORS[(index + offset) % AVATAR_COLORS.length]);
      avatar.textContent = (member.name || "?")[0].toUpperCase();
      const label = document.createElement("span");
      label.className = "member-name" + (member.bot ? " bot" : "");
      if (!member.bot && member.role_color) label.style.color = member.role_color;
      label.textContent = member.name;
      row.append(avatar, label);
      list.appendChild(row);
    });
  };
  addGroup("ONLINE", online, 0);
  addGroup("OFFLINE", offline, online.length);
}

function channelName(st) {

  return c ? c.name : (st.channel ? st.channel.name : "playground");
}

function renderChannels(st) {

/* ---------------- composer: chat + slash commands ---------------- */
const composerInput = $("#composer-input"), palette = $("#palette"), cmdForm = $("#cmd-form");

function commandList() {
  return Object.values((lastState && lastState.commands) || {});
}

function showPalette(filter) {
  const cmds = commandList().filter((c) => c.name.startsWith(filter.toLowerCase()));
  palette.innerHTML = "";
  if (!cmds.length) {
    const empty = document.createElement("div");
    empty.className = "palette-empty";
    empty.textContent = commandList().length
      ? "No command matches — try another name."
      : "No slash commands yet — define some with @app_commands.command() and press Run.";
    palette.appendChild(empty);
  }
  for (const c of cmds) {
    const item = document.createElement("div");
    item.className = "palette-item";
    item.innerHTML = `<span class="pname"></span><span class="pdesc"></span>`;
    item.querySelector(".pname").textContent = "/" + c.name;
    item.querySelector(".pdesc").textContent = c.description +
      (c.params.length ? ` · ${c.params.map((p) => p.name).join(", ")}` : "");
    item.onclick = () => { hidePalette(); openCommandForm(c); };
    palette.appendChild(item);
  }
  palette.classList.add("open");
}

function hidePalette() { palette.classList.remove("open"); }

function paramInput(p) {
  const wrap = document.createElement("div");
  wrap.className = "pf";
  const label = document.createElement("label");
  label.innerHTML = `<span></span>${p.required ? ' <span class="req">*</span>' : ""}`;
  label.querySelector("span").textContent = p.name.toUpperCase();
  wrap.appendChild(label);
  let field;
  if (p.choices.length) {
    field = document.createElement("select");
    field.appendChild(new Option("— pick —", ""));
    for (const [n, v] of p.choices) field.appendChild(new Option(n, String(v)));
  } else if (p.type === "boolean") {
    field = document.createElement("select");
    field.appendChild(new Option("true", "true"));
    field.appendChild(new Option("false", "false"));
  } else if (p.type === "user") {
    field = document.createElement("select");
    for (const [id, name] of Object.entries(lastState.members)) {
      if (!id.startsWith("&")) field.appendChild(new Option("@" + name, id));
    }
  } else if (p.type === "role") {
    field = document.createElement("select");
    for (const [id, name] of Object.entries(lastState.members)) {
      if (id.startsWith("&")) field.appendChild(new Option("@" + name, id.slice(1)));
    }
  } else if (p.type === "channel") {
    field = document.createElement("select");
    field.appendChild(new Option("#" + lastState.channel.name, lastState.channel.id));
  } else {
    field = document.createElement("input");
    field.type = p.type === "integer" || p.type === "number" ? "number"
      : p.type === "attachment" ? "text" : "text";
    if (p.type === "attachment") field.placeholder = "filename.txt";
  }
  field.dataset.pname = p.name;
  wrap.appendChild(field);
  return wrap;
}

function openCommandForm(def) {
  cmdMode = def;
  cmdForm.innerHTML = "";
  const chip = document.createElement("span");
  chip.className = "cmd-chip";
  chip.textContent = "/" + def.name;
  cmdForm.appendChild(chip);
  for (const p of def.params) cmdForm.appendChild(paramInput(p));
  const send = document.createElement("button");
  send.id = "cmd-send"; send.textContent = "Send ➤";
  send.onclick = submitCommand;
  const cancel = document.createElement("button");
  cancel.id = "cmd-cancel"; cancel.textContent = "✕"; cancel.title = "Cancel (Esc)";
  cancel.onclick = closeCommandForm;
  cmdForm.appendChild(send); cmdForm.appendChild(cancel);
  cmdForm.classList.add("open");
  $("#composer-box").style.display = "none";
  const first = cmdForm.querySelector("input, select");
  if (first) first.focus();
}

function closeCommandForm() {
  cmdMode = null;
  cmdForm.classList.remove("open");
  cmdForm.innerHTML = "";
  $("#composer-box").style.display = "flex";
  composerInput.focus();
}

async function submitCommand() {
  if (!cmdMode) return;
  const args = {};
  for (const field of cmdForm.querySelectorAll("[data-pname]")) {
    if (field.value !== "") args[field.dataset.pname] = field.value;
  }
  const def = cmdMode;
  closeCommandForm();
  composerInput.value = "";
  await post("command", { name: def.name, args, channel_id: currentChannel });
}

composerInput.addEventListener("input", () => {
  const v = composerInput.value;
  if (!cmdMode && v.startsWith("/")) showPalette(v.slice(1));
  else hidePalette();
});
composerInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    const text = composerInput.value.trim();
    if (!cmdMode && text.startsWith("/")) {
      const query = text.slice(1).toLowerCase();
      const match = commandList().find((c) => c.name === query)
        || commandList().find((c) => c.name.startsWith(query));
      if (match) { composerInput.value = ""; hidePalette(); openCommandForm(match); }
      return;
    }
    if (cmdMode) { submitCommand(); return; }
    if (!text) return;
    composerInput.value = "";
    post("message", { content: text, channel_id: currentChannel });
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && cmdMode) closeCommandForm();
});
