  activeEntry = entry;
  loadedScript = null;
  $("#code").value = data.code;
  $("#run-stats").textContent = `— connected ${name}/${entry}`;
};

$("#btn-save").dataset.workspaceSave = "true";
$("#btn-save").addEventListener("click", async (event) => {
  if (!activeWorkspace || event.__workspaceHandled) return;
  event.__workspaceHandled = true;
  event.stopImmediatePropagation();
  const res = await fetch(`/api/workspaces/${encodeURIComponent(activeWorkspace)}/files/${encodeURIComponent(activeEntry)}`, {
    method: "PUT", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code: $("#code").value }),
  });
  const data = await res.json();
  $("#run-stats").textContent = data.ok ? `— saved ${activeWorkspace}/${activeEntry}` : `— ${data.error}`;
});

function blockCode() {
  const text = JSON.stringify($("#block-content").value);
  const title = JSON.stringify($("#block-title").value);
  const description = JSON.stringify($("#block-description").value);
  const label = JSON.stringify($("#block-label").value);
  const customId = JSON.stringify($("#block-id").value);
  const rawColor = $("#block-color").value.replace("#", "");
  const color = /^[0-9a-f]{6}$/i.test(rawColor) ? `0x${rawColor}` : "0x5865F2";
  return `import discord\n\nasync def main():\n    embed = discord.Embed(title=${title}, description=${description}, color=${color})\n    view = discord.ui.View()\n    view.add_item(discord.ui.Button(label=${label}, custom_id=${customId}))\n    await send(content=${text}, embed=embed, view=view)\n`;
}
function updateBlocks() {
  const preview = $("#block-preview");
  preview.textContent = `${$("#block-title").value || "Untitled embed"} — ${$("#block-description").value || "No description"}`;
}
for (const field of document.querySelectorAll("#block-panel input")) field.addEventListener("input", updateBlocks);
$("#btn-blocks").onclick = () => { $("#block-panel").classList.toggle("open"); updateBlocks(); };
$("#btn-apply-blocks").onclick = () => {
  $("#code").value = blockCode();
  activeWorkspace = null;
  loadedScript = null;
  $("#block-panel").classList.remove("open");
  $("#run-stats").textContent = "— blocks applied to editor";
};

function jumpToEditorLine(line) {
  const editor = $("#code");
  const lines = editor.value.split("\n");
  if (!Number.isInteger(line) || line < 1 || line > lines.length) return;
  const start = lines.slice(0, line - 1).reduce((total, value) => total + value.length + 1, 0);
  editor.focus();
  editor.setSelectionRange(start, start + lines[line - 1].length);
  const lineHeight = Number.parseFloat(getComputedStyle(editor).lineHeight) || 20;
  editor.scrollTop = Math.max(0, (line - 3) * lineHeight);
}

let runErrorFingerprint;
function renderRunError(run) {
  const fingerprint = JSON.stringify(run ?? null);
  if (fingerprint === runErrorFingerprint) return;
  runErrorFingerprint = fingerprint;
  const panel = $("#run-error");
  panel.replaceChildren();
  const error = run && run.exception;
  if (!error || run.ok) { panel.classList.remove("open"); return; }
  const heading = document.createElement("div");
  heading.className = "run-error-title";
  heading.textContent = `ERROR · ${error.type || "ScriptError"}`;
  const location = document.createElement("div");
  location.className = "run-error-location";
  const filename = error.file === "<playground>" ? "bot.py" : error.file;
  location.textContent = filename && Number.isInteger(error.line) ? `${filename}:${error.line}` : "Script location unavailable";
  const message = document.createElement("div");
  message.className = "run-error-message";
  message.textContent = error.message || run.error || "Script failed";
  const trace = document.createElement("details");
  trace.className = "run-error-trace";
  if (run.error && run.error !== error.message) {
    const summary = document.createElement("summary");
    summary.textContent = "Show traceback";
    const pre = document.createElement("pre");
    pre.textContent = run.error;
    trace.append(summary, pre);
  }
  const actions = document.createElement("div");
  actions.className = "run-error-actions";
  const copy = document.createElement("button");
  copy.type = "button";
  copy.className = "tool-link";
  copy.textContent = "Copy error";
  copy.onclick = async () => {
    const summary = `${error.type || "ScriptError"}: ${error.message || run.error || "Script failed"}`
      + (filename && error.line ? `\n${filename}:${error.line}` : "")
      + (run.error && run.error !== error.message ? `\n\n${run.error}` : "");
    try {
      await navigator.clipboard.writeText(summary);
      copy.textContent = "Copied";
    } catch (_) {
      const fallback = document.createElement("textarea");
      fallback.value = summary;
      fallback.setAttribute("readonly", "");
      fallback.style.position = "fixed";
      fallback.style.opacity = "0";
      document.body.appendChild(fallback);
      fallback.select();
      const copied = document.execCommand("copy");
      fallback.remove();
      if (copied) copy.textContent = "Copied";
      else pgAlert("Could not copy the error in this browser context.");
    }
  };
  actions.appendChild(copy);
  if (error.file === "<playground>" && Number.isInteger(error.line)) {
    const jump = document.createElement("button");
    jump.type = "button";
    jump.className = "tool-link";
    jump.textContent = "Jump to line";
    jump.onclick = () => {
      jumpToEditorLine(error.line);
      $("#run-stats").textContent = `— ${lastRunSource}:${error.line}`;
    };
    actions.appendChild(jump);
  }
  const stateButton = document.createElement("button");
  stateButton.type = "button";
  stateButton.className = "tool-link";
  stateButton.textContent = "Inspect State";
  stateButton.onclick = () => setInspector("state");
  actions.appendChild(stateButton);
  panel.append(heading, location, message);
  if (trace.childNodes.length) panel.appendChild(trace);
  panel.appendChild(actions);
  panel.classList.add("open");
}

$("#btn-run").onclick = async () => {
  const code = $("#code").value;
  localStorage.setItem("pg-code", code);
  lastRunSource = activeWorkspace ? `${activeWorkspace}/${activeEntry}` : loadedScript ? `${loadedScript}.py` : "editor";
  $("#btn-run").disabled = true;
  try {
    const url = activeWorkspace ? `/api/session/${SID}/project` : `/api/session/${SID}/run`;
    const payload = activeWorkspace ? { workspace: activeWorkspace } : { code };
    const res = await fetch(url, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
    });
    if (!res.ok) {
      const error = await res.json();
      pgAlert(error.error || "Run failed.");
      return;
    }
    if (activeWorkspace) {
      const data = await res.json();
      const status = data.status || {};
      $("#run-stats").textContent =
        `— ${status.bot || "bot"} · cogs: ${(status.cogs || []).join(", ") || "none"} · ${(status.commands || []).length} slash commands`;
    }
  } catch (error) {
    pgAlert(error.message || "Run request failed.");
  } finally { $("#btn-run").disabled = false; await refresh(); }
};
$("#code").addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); $("#btn-run").click(); }
  if (e.key === "Tab") {
    e.preventDefault();
    const { selectionStart: s, selectionEnd: en, value: v } = e.target;
    e.target.value = v.slice(0, s) + "    " + v.slice(en);
    e.target.selectionStart = e.target.selectionEnd = s + 4;
  }
});
$("#btn-restart").onclick = async () => {
  await post("restart", {});
  $("#run-stats").textContent = "— restarted";
};

/* ---------------- script library ---------------- */
let loadedScript = null; // which library script is in the editor, if any
let lastRunSource = "editor";

function pgAlert(message) {
  $("#run-stats").textContent = "— " + message;
  const line = document.createElement("div");
  line.className = "console-line error";
  line.textContent = "⛔ " + message;
  consoleBody.appendChild(line);
  consoleBody.scrollTop = consoleBody.scrollHeight;
}

async function loadLibrary() {
  const res = await fetch("/api/scripts");
  libScripts = (await res.json()).scripts;
  const sel = $("#script-select");
  sel.innerHTML = "";
  for (const s of libScripts) {
    const opt = new Option((s.main ? "★ " : "\u3000") + s.name, s.name);
    opt.title = s.description || s.name;
    sel.appendChild(opt);
  }
  const valid = (n) => n && libScripts.some((s) => s.name === n);
  if (!valid(loadedScript)) loadedScript = (libScripts.find((s) => s.main) || libScripts[0] || {}).name || null;
  sel.value = loadedScript || "";
}

$("#script-select").addEventListener("change", async (e) => {
  const name = e.target.value;
  if (!name) return;
  const res = await fetch(`/api/scripts/${encodeURIComponent(name)}`);
  if (!res.ok) return;
  const data = await res.json();
  $("#code").value = data.code;
  localStorage.setItem("pg-code", data.code);
  loadedScript = name;
  $("#run-stats").textContent = "— loaded " + name;
});

$("#btn-save").onclick = async () => {
  const name = prompt("Save script as:", loadedScript || "");
  if (name === null) return;
  const res = await fetch("/api/scripts", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, code: $("#code").value }),
  });
  const data = await res.json();
  if (!data.ok) { pgAlert(data.error || "Save failed"); return; }
  loadedScript = data.name;
  await loadLibrary();
  $("#run-stats").textContent = data.existed ? `— updated ${data.name}` : `— saved ${data.name}`;
};

$("#btn-suite").onclick = async () => {
  const res = await fetch("/api/scripts/test", { method: "POST" });
  const data = await res.json();
  if (!res.ok) { pgAlert(data.error || "Test suite failed"); return; }
  consoleBody.innerHTML = "";
  for (const report of data.reports) {
    const line = document.createElement("div");
    line.className = "console-line" + (report.ok ? "" : " error");
    const error = report.error ? " — " + report.error.trim().split("\\n").pop() : "";
    line.textContent = `${report.ok ? "✅" : "❌"} ${report.name} — ${report.ms.toFixed(0)} ms, ${report.messages} messages${error}`;
    consoleBody.appendChild(line);
  }
  $("#run-stats").textContent = `— ${data.reports.filter((report) => report.ok).length}/${data.reports.length} scripts passed`;
};

const scenarioPanel = $("#scenario-panel");
const scenarioEditor = $("#scenario-json");
const scenarioResults = $("#scenario-results");

$("#btn-scenarios").onclick = () => {
  scenarioPanel.classList.toggle("open");
  if (scenarioPanel.classList.contains("open")) loadScenarios();
};

async function loadScenarios(selectedName = $("#scenario-select").value) {
  const response = await fetch("/api/scenarios");
  if (!response.ok) { pgAlert("Could not load scenarios."); return; }
  const { scenarios } = await response.json();
  const select = $("#scenario-select");
  select.innerHTML = "";
  select.appendChild(new Option("New scenario…", ""));
  for (const scenario of scenarios) {
    select.appendChild(new Option(`${scenario.name} (${scenario.steps} steps)`, scenario.name));
  }
  if ([...select.options].some((option) => option.value === selectedName)) select.value = selectedName;
}

$("#scenario-load").onclick = async () => {
  const name = $("#scenario-select").value;
  if (!name) { pgAlert("Choose a saved scenario first."); return; }
  const response = await fetch(`/api/scenarios/${encodeURIComponent(name)}`);
  if (!response.ok) { pgAlert("Could not load that scenario."); return; }
  scenarioEditor.value = JSON.stringify(await response.json(), null, 2);
  scenarioResults.classList.remove("open");
  $("#run-stats").textContent = `— loaded scenario ${name}`;
};

function parseScenarioEditor() {
  try { return JSON.parse(scenarioEditor.value); }
  catch (error) { throw new Error(`Scenario JSON is invalid: ${error.message}`); }
}

$("#scenario-save").onclick = async () => {
  let scenario;
  try { scenario = parseScenarioEditor(); }
  catch (error) { pgAlert(error.message); return; }
  const response = await fetch("/api/scenarios", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ scenario }),
  });
  const data = await response.json();
  if (!response.ok || !data.ok) { pgAlert(data.error || "Scenario save failed."); return; }
  await loadScenarios(data.name);
  $("#run-stats").textContent = data.existed ? `— updated scenario ${data.name}` : `— saved scenario ${data.name}`;
};

$("#scenario-run").onclick = async () => {
  let scenario;
  try { scenario = parseScenarioEditor(); }
  catch (error) { pgAlert(error.message); return; }
  const button = $("#scenario-run");
  button.disabled = true;
  button.textContent = "Running…";
  scenarioResults.replaceChildren();
  scenarioResults.classList.add("open");
  try {
    const response = await fetch(`/api/session/${SID}/scenario`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ scenario }),
    });
    const data = await response.json();
    if (!response.ok) { pgAlert(data.error || "Scenario failed to start."); return; }
    if (data.state) render(data.state);
    for (const result of data.results || []) {
      const row = document.createElement("div");
      row.className = "scenario-result" + (result.passed ? "" : " failed");
      row.textContent = `${result.passed ? "PASS" : "FAIL"} · Step ${result.step}: ${result.label} — ${result.actual} (expected: ${result.expected})`;
      scenarioResults.appendChild(row);
    }
    if (data.runtime_state) {
      const details = document.createElement("details");
      details.className = "scenario-runtime";
      const summary = document.createElement("summary");
      summary.textContent = data.ok ? "Runtime state after replay" : `Runtime state at failed step ${data.failed_step}`;
      const pre = document.createElement("pre");
      pre.textContent = JSON.stringify(data.runtime_state, null, 2);
      details.append(summary, pre);
      scenarioResults.appendChild(details);
    }
    $("#run-stats").textContent = data.ok
      ? `— scenario passed (${data.results.length} steps)`
      : `— scenario failed at step ${data.failed_step}`;
  } catch (error) {
    pgAlert(error.message || "Scenario request failed.");
  } finally {
    button.disabled = false;
    button.textContent = "▶ Run scenario";
  }
};

$("#btn-delete").onclick = async () => {
  if (!loadedScript) { pgAlert("No library script is loaded — pick one in the dropdown first."); return; }
  if (!confirm(`Delete "${loadedScript}" from the library?`)) return;
  await fetch(`/api/scripts/${encodeURIComponent(loadedScript)}`, { method: "DELETE" });
  loadedScript = null;
  await loadLibrary();
  $("#run-stats").textContent = "— deleted";
};

/* ---------------- design bridge (Embeder -> playground) ---------------- */
$("#btn-design").onclick = async () => {
  const res = await fetch("/api/designs");
  const { designs } = await res.json();
  if (!designs.length) {
    pgAlert("No saved designs yet — create one in Embeder first.");
    return;
  }
  const pick = designs[designs.length - 1].name;
  const get = await fetch(`/api/designs/${encodeURIComponent(pick)}`);
  if (!get.ok) { pgAlert("Could not load the latest design."); return; }
  const design = await get.json();
  const bridge = await fetch("/api/bridge/design-to-code", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ design }),
  });
  const data = await bridge.json();
  if (!data.ok) { pgAlert(data.error || "Bridge failed"); return; }
  $("#code").value = data.code;
  localStorage.setItem("pg-code", data.code);
  loadedScript = null;
  $("#run-stats").textContent = "— design imported: " + pick;
};

/* Receiving side of the builder's "Test in playground" button: the builder
   writes our autosave key, and the storage event fires here (same origin). */
window.addEventListener("storage", (e) => {
  if (e.key !== "pg-code" || e.newValue === null || e.newValue === $("#code").value) return;
  $("#code").value = e.newValue;
  loadedScript = null;
  $("#run-stats").textContent = "— design pushed from Embeder";
});

boot();
</script>
</body>
</html>
