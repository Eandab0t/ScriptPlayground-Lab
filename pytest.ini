[pytest]
# Collect this project's tests only.
#
# `bots/*` is gitignored and holds folders a user connected for the playground
# (see .gitignore "bots/*"). Those are third-party bots, not part of this
# suite, and one of them ships its own test_*.py files -- collecting them made
# `pytest -q` fail with a collection error from inside someone else's repo.
testpaths = tests
norecursedirs = .* bots build dist CVS _darcs node_modules venv __pycache__ {arch}

# tests/test_smoke.py and tests/test_scenarios.py define their cases as
# `async def test_*` and also run them from __main__. pytest-asyncio is
# installed but defaults to strict mode, so without this they were collected
# and then failed with "async def functions are not natively supported".
asyncio_mode = auto
