name: CI

# Desktop flow on every push: the Windows job boots the real Electron shell
# via scripts/walk_desktop.js. PRs run everything too; pushes to main run the
# same (cheap, fully offline) pipeline. No jobs need network egress beyond
# package installation.
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  python:
    name: Python suites
    # Pinned: ubuntu-latest migrates to Ubuntu 26 on 2026-10-19 and the script
    # watchdog depends on Linux thread scheduling, so an unpinned image turns a
    # platform move into an unexplained test failure.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install dev tools (not in requirements.txt)
        # Pinned: an unpinned test toolchain lets a green run stop meaning the
        # same thing without any commit. See requirements-dev.txt.
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Smoke suites (auto-discovered)
        run: |
          python -X utf8 -m tests.test_smoke
          python -X utf8 -m tests.test_scenarios

      - name: Project runtime (pytest)
        run: python -X utf8 -m pytest tests/test_project_runtime.py -q

      # This is the suite docs/COMPATIBILITY.md points at: it boots a real
      # discord.py bot in a real worker and proves the callback fires. A feature
      # may only be listed as "Supported" when a test here proves it, so this
      # gate and the matrix have to move together.
      - name: Real-bot acceptance suite (compatibility matrix proof)
        run: python -X utf8 -m pytest tests/test_acceptance.py -q

      # `--ignore` because `testpaths = tests` already collects the acceptance
      # module: without it these 33 tests run twice in the same job. The gate
      # above is the authoritative run.
      - name: Full suite (everything except the acceptance gate above)
        run: python -X utf8 -m pytest -q --ignore=tests/test_acceptance.py

      - name: Clean session artifacts
        if: always()
        run: rm -rf .test-artifacts __pycache__ tests/__pycache__

  browser:
    name: Browser (Playwright)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Browser regression suite
        run: npm run test:browser

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 5

  desktop:
    name: Desktop walk (Electron)
    # The walker boots the real Electron shell against a spawned server; only
    # Windows runners match the environment the product actually ships on.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright chromium (drives the Electron shell)
        # No --with-deps on Windows; Electron ships its own runtime.
        run: npx playwright install chromium

      - name: Walk the desktop app end to end
        run: npm run walk

      - name: Upload walker artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-walk-logs
          path: |
            .test-artifacts/desktop-walk/
            ~/AppData/Local/ScriptPlayground/ScriptPlayground.log
          if-no-files-found: ignore
          retention-days: 5

  packaged:
    name: Packaged release (PyInstaller + Electron)
    # The `desktop` job above walks the dev checkout, so it never exercises what
    # users actually download: PyInstaller's bundled interpreter, electron-
    # builder's extraResources wiring, the packaged resource paths, or the
    # bundled node_shim. This job builds the real artifact and walks that exact
    # binary, which is the release check docs/DESKTOP_BUILD.md describes.
    #
    # Push-only on purpose: `npm run dist` is minutes of CPU for a check that
    # only matters once the tree is heading somewhere. PRs get the dev walk.
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Python dependencies
        # requirements-dev.txt carries the PyInstaller pin; requirements.txt
        # supplies the runtime modules the frozen server must bundle.
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright chromium (drives the Electron shell)
        run: npx playwright install chromium

      - name: Build the packaged desktop app
        run: npm run dist

      - name: Walk the packaged executable end to end
        run: npm run walk:packaged

      - name: Upload packaged walk artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-walk-logs
          path: |
            .test-artifacts/desktop-walk-packaged/
            ~/AppData/Local/ScriptPlayground/ScriptPlayground.log
          if-no-files-found: ignore
          retention-days: 5
